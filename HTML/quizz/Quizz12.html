<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Example</title>
    <link rel="stylesheet" href="/CSS/quizz.css">
    </head>
    <body>
        <div class="quiz-container">
            <h1>4. Par quel événement est marqué le début de chaque cycle de sprint ?</h1>
            <div class="question-area"></div>
            <div class="answers">
                <button class="answer" data-correct="true">Réponse A : <br>Une réunion de planification de sprint</button>
                <button class="answer" data-correct="false">Réponse B : <br>La nomination d’un nouveau SCRUM Master</button>
                <button class="answer" data-correct="false">Réponse C : <br>L’analyse des feedback utilisateurs</button>
                <button class="answer" data-correct="false">Réponse D : <br>Il n’y a pas d’évènement spécifique</button>
            </div>
            <div class="footer">
                <div class="message" style="display: none;"></div> <!-- Message area -->
                <button class="next" disabled>Valider</button>
                <form action="/HTML/quizz/Quizz5.html" method="get">
                    <button class="next-next" style="display: none;">Suivant →</button>
                </form>
            </div>
        </div>
        <script type="module" src="/JS/quiz.js"></script>
    </body>
</html>
