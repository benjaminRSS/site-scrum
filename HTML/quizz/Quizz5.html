<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Example</title>
    <link rel="stylesheet" href="/CSS/quizz.css">
    </head>
    <body>
        <div class="quiz-container">
            <h1>5. En période de sprint, l’équipe SCRUM organise une réunion quotidienne ?</h1>
            <div class="question-area"></div>
            <div class="answers">
                <button class="answer" data-correct="true">Réponse A : <br>VRAI</button>
                <button class="answer" data-correct="false">Réponse B : <br>FAUX</button>
            </div>
            <div class="footer">
                <div class="message" style="display: none;"></div> <!-- Message area -->
                <button class="next" disabled>Valider</button>
                <form action="/HTML/quizz/Quizz6.html" method="get">
                    <button class="next-next" style="display: none;">Suivant →</button>
                </form>
            </div>
        </div>
        <script type="module" src="/JS/quiz.js"></script>
    </body>
</html>
