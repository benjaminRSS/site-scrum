<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Example</title>
    <link rel="stylesheet" href="/CSS/quizz.css">
    </head>
    <body>
        <div class="quiz-container">
            <h1>7. Quel est l’objectif principal de la revue de sprint ?</h1>
            <div class="question-area"></div>
            <div class="answers">
                <button class="answer" data-correct="false">Réponse A : <br>Assigner les tâches restantes entre les membres de l’équipe</button>
                <button class="answer" data-correct="false">Réponse B : <br>Écouter l’avis du SCRUM Master</button>
                <button class="answer" data-correct="false">Réponse C : <br>Conclure le projet par la validation du produit final</button>
                <button class="answer" data-correct="true">Réponse D : <br>Valider les résultats et récolter du feedback</button>
            </div>
            <div class="footer">
                <div class="message" style="display: none;"></div> <!-- Message area -->
                <button class="next" disabled>Valider</button>
                <form action="/HTML/quizz/Quizz8.html" method="get">
                    <button class="next-next" style="display: none;">Suivant →</button>
                </form>
            </div>
        </div>
        <script type="module" src="/JS/quiz.js"></script>
    </body>
</html>
